# Untrusted: builds and tests the marketplace website on every pull request,
# including forks. No secrets, no environment, a read-only token, and it
# never deploys: only pages.yml (push to main) and publish.yml (owner's
# release tag) reach the github-pages environment.
#
# `Registry preservation` composes the Pages artifact exactly as a deploy
# would and proves that the website leaves every registry path untouched.
name: Website

on:
  pull_request:

permissions: {}

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Website
    uses: ./.github/workflows/_website.yml
    permissions:
      contents: read

  preservation:
    name: Registry preservation
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests of the compose rules
        run: python3 -I tools/tests/test_compose_site.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website
          path: ${{ runner.temp }}/website
      - name: Compose with the registry tree; no registry path may change
        run: |
          tools/build-landing.sh "$RUNNER_TEMP/registry"
          python3 -I tools/compose-site.py --registry "$RUNNER_TEMP/registry" \
            --website "$RUNNER_TEMP/website" --out "$RUNNER_TEMP/site"
