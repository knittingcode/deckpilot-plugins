# Untrusted, like validate.yml and first-party.yml: runs on every pull
# request, including forks, and on main. No secrets, no environment, a
# read-only token, no caches. It builds, tests, checks and packages the
# official plugins (official/, the ones DeckPilot bundles), proves the build
# reproducible, compares it with DeckPilot's own build of the same source,
# and signs with a THROWAWAY publisher key made in the job. Nothing it produces
# is released or used by a release workflow: official-release.yml rebuilds
# from the tagged commit.
name: Official plugins

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: official-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  official:
    name: Build, test, check and package official plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests of the official/ rules
        run: python3 -I tools/tests/test_check_official.py
      - name: Tests of the official Marketplace entry rules
        run: python3 -I tools/tests/test_official_entry.py
      - name: The pinned toolchain with rustfmt, clippy and the wasm target
        run: |
          channel=$(sed -n 's/^channel *= *"\([0-9.]*\)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --no-self-update \
            --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Build the pinned deckpilot-registry and schema-check (and fetch the pinned DeckPilot)
        run: tools/build-cli.sh
      - name: Layout, SDK pin, permission policy, compatibility, fixtures equal DeckPilot's
        run: tools/official.sh check
      - name: Unit tests, formatting, clippy
        run: tools/official.sh test
      - name: Manifest schema, wasm modules, packages
        run: tools/official.sh package
      - name: Two clean builds are byte-identical
        run: tools/official.sh repro
      - name: Compare with DeckPilot's plugins/first-party/build.sh at the pin (informational)
        run: tools/official.sh compare
      - name: Throwaway publisher signature, release verify, released-pins guard
        run: tools/official.sh sign-test
      - name: Candidate Marketplace entries and the compatibility matrix
        run: python3 -I tools/official-entry.py check
      - name: Marketplace entries from throwaway-signed fixture releases (refusals, discovery, dependencies, update offer)
        run: tools/tests/test-official-marketplace.sh
