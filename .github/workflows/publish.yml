# Trusted publication. Runs only for a release tag the owner creates (tags
# are admin-only by ruleset): `<plugin-id>--v<version>` publishes that
# version, `registry--v<anything>` re-signs the index only (revocations,
# yanks, listing changes). Dispatch it again on the same tag ref to retry:
#   gh workflow run publish.yml --ref <tag>
#
# Jobs, in order:
#   resolve           the tag names a reviewed commit on main and a recorded
#                     version; every other version is already released
#   build             UNPRIVILEGED (no environment, no secret, contents: read):
#                     rebuilds every recorded package from its pinned source
#                     at the tagged commit; plugin build scripts run here only
#   sign              environment registry-release, index and timestamp keys:
#                     builds nothing; takes the packages of `build` from this
#                     run, re-checks every sha256 and size against the
#                     reviewed pins, signs, verify-site as an existing client
#   release           contents: write: uploads the verified package to the
#                     GitHub Release of the tag (never creates a tag)
#   website           UNPRIVILEGED (no environment, no secret): builds the
#                     marketplace website, with its catalog generated from
#                     the registry `sign` just verified; read-only consumer
#   deploy            github-pages: the signed /v1/ byte for byte, the
#                     website around it (tools/compose-site.py fails if the
#                     website touches a registry path)
#   verify-published  fetches the live site anonymously and verifies it
#
# Nothing from validate.yml or any other workflow run is used. The root key
# is never here; it stays offline.
name: Publish

on:
  push:
    tags: ["*--v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: registry-pages
  cancel-in-progress: false

env:
  REGISTRY_URL: https://knittingcode.github.io/deckpilot-plugins

jobs:
  resolve:
    name: Resolve the release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      kind: ${{ steps.tag.outputs.kind }}
      commit: ${{ steps.tag.outputs.commit }}
      id: ${{ steps.tag.outputs.id }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Publishing must be enabled and the run must be on a tag
        env:
          ENABLED: ${{ vars.REGISTRY_PUBLISH_ENABLED }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          [ "$ENABLED" = true ] || { echo "::error::REGISTRY_PUBLISH_ENABLED is not 'true': the registry-release environment and its secrets are not set up"; exit 1; }
          [ "$REF_TYPE" = tag ] || { echo "::error::run publish.yml on a release tag (gh workflow run publish.yml --ref <tag>)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: tools/resolve-tag.sh "$TAG" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build packages
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
      - name: Build the pinned deckpilot-registry and schema-check
        run: tools/build-cli.sh
      - name: Rebuild every recorded package and check it against its pins
        run: |
          tools/validate.sh registry
          cp -R .work/validate/registry/releases "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          retention-days: 1
          if-no-files-found: error

  sign:
    name: Sign the registry
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: registry-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
      - name: Build the pinned deckpilot-registry (DeckPilot code only, no plugin code)
        run: tools/build-cli.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: Verify the packages against the pins, sign index and timestamp, verify as an existing client
        env:
          REGISTRY_INDEX_KEY: ${{ secrets.REGISTRY_INDEX_KEY }}
          REGISTRY_INDEX_KEY_PASSWORD: ${{ secrets.REGISTRY_INDEX_KEY_PASSWORD }}
          REGISTRY_TIMESTAMP_KEY: ${{ secrets.REGISTRY_TIMESTAMP_KEY }}
          REGISTRY_TIMESTAMP_KEY_PASSWORD: ${{ secrets.REGISTRY_TIMESTAMP_KEY_PASSWORD }}
        run: |
          tools/publish-site.sh index --packages "$RUNNER_TEMP/packages" \
            --out "$RUNNER_TEMP/ws" --base-url "$REGISTRY_URL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-v1
          path: ${{ runner.temp }}/ws/site/v1
          retention-days: 1
          if-no-files-found: error

  release:
    name: Upload the release asset
    needs: [resolve, sign]
    if: needs.resolve.outputs.kind == 'plugin'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: Upload to the release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          ID: ${{ needs.resolve.outputs.id }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: tools/upload-release.sh "$TAG" "$ID" "$VERSION" "$RUNNER_TEMP/packages"

  website:
    name: Website
    needs: [resolve, sign]
    uses: ./.github/workflows/_website.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      registry-artifact: registry-v1
      registry-path: .
      registry-verified: true
      # The tagged commit passed the browser tests when it reached main; a
      # publication must not depend on them a second time.
      browser-tests: false
    permissions:
      contents: read

  deploy:
    name: Deploy the registry
    needs: [resolve, sign, release, website]
    if: always() && needs.sign.result == 'success' && needs.website.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-v1
          path: ${{ runner.temp }}/registry-v1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website
          path: ${{ runner.temp }}/website
      - name: Compose the signed /v1/ (byte for byte) and the website around it
        run: |
          tools/build-landing.sh "$RUNNER_TEMP/registry"
          rm -rf "$RUNNER_TEMP/registry/v1"
          mv "$RUNNER_TEMP/registry-v1" "$RUNNER_TEMP/registry/v1"
          python3 -I tools/compose-site.py --registry "$RUNNER_TEMP/registry" \
            --website "$RUNNER_TEMP/website" --out "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-published:
    name: Verify the published registry
    needs: [resolve, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
      - name: Build the pinned deckpilot-registry
        run: tools/build-cli.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-v1
          path: ${{ runner.temp }}/expected
      - name: Fetch the live site anonymously and verify it
        run: tools/verify-published.sh "$REGISTRY_URL" "$RUNNER_TEMP/expected/timestamp.json"
