# Trusted publication. Runs only for a release tag the owner creates (tags
# are admin-only by ruleset): `<plugin-id>--v<version>` publishes that
# version, `registry--v<anything>` re-signs the index only (revocations,
# yanks, listing changes). Dispatch it again on the same tag ref to retry:
#   gh workflow run publish.yml --ref <tag>
#
# Jobs, in order:
#   resolve           the tag names a reviewed commit on main and a recorded
#                     version; every other version is already released
#   gate              UNPRIVILEGED: registry-release is tag-only, cannot be
#                     bypassed and is authorized by a reviewer or by the
#                     admin-only tag ruleset; every required check of main
#                     passed for the tagged commit
#   build             UNPRIVILEGED (no environment, no secret, contents: read):
#                     rebuilds every recorded package from its pinned source
#                     at the tagged commit; plugin build scripts run here only.
#                     An official plugin (official/marketplace/) is not
#                     rebuilt: its release asset is downloaded and verified
#                     with the pinned publisher keys (tools/validate.sh)
#   cli               UNPRIVILEGED: builds the pinned deckpilot-registry
#                     (DeckPilot code only), an artifact with its sha256
#   sign              environment registry-release, index and timestamp keys:
#                     builds and compiles nothing (installs the cli job's
#                     binaries, sha256 checked); takes the packages of `build` from this
#                     run, re-checks every sha256 and size against the
#                     reviewed pins, signs, verify-site as an existing client
#   release           contents: write: uploads the verified package to the
#                     GitHub Release of the tag (never creates a tag)
#   website           UNPRIVILEGED (no environment, no secret): builds the
#                     marketplace website, with its catalog generated from
#                     the registry `sign` just verified; read-only consumer
#   pages-build       contents: write only: a build commit on the branch
#                     pages-builds, the build version of this deployment
#                     (Pages ignores a version it has seen, and refuses
#                     one that is not a commit; tools/pages-build-commit.sh)
#   deploy            github-pages: the signed /v1/ byte for byte, the
#                     website around it (tools/compose-site.py fails if the
#                     website touches a registry path)
#   verify-published  fetches the live site anonymously and verifies it
#
# Nothing from validate.yml or any other workflow run is used. The root key
# is never here; it stays offline.
name: Publish

on:
  push:
    # Not the plugins DeckPilot bundles: the registry never serves them;
    # their tags are official-release.yml's. Not the publisher key test's
    # tags either (official-test-sign.yml, never a release).
    tags:
      - "*--v*"
      - "!deckpilot.publisher-test--v*"
      - "!deckpilot.docker--v*"
      - "!deckpilot.git--v*"
      - "!deckpilot.github--v*"
      - "!deckpilot.gitlab--v*"
      - "!deckpilot.jira--v*"
      - "!deckpilot.notifications--v*"
      - "!deckpilot.projects--v*"
      - "!deckpilot.workflows--v*"
      - "!deckpilot.workspace--v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: registry-pages
  cancel-in-progress: false

env:
  REGISTRY_URL: https://knittingcode.github.io/deckpilot-plugins

jobs:
  resolve:
    name: Resolve the release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      kind: ${{ steps.tag.outputs.kind }}
      commit: ${{ steps.tag.outputs.commit }}
      id: ${{ steps.tag.outputs.id }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Publishing must be enabled and the run must be on a tag
        env:
          ENABLED: ${{ vars.REGISTRY_PUBLISH_ENABLED }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          [ "$ENABLED" = true ] || { echo "::error::REGISTRY_PUBLISH_ENABLED is not 'true': the registry-release environment and its secrets are not set up"; exit 1; }
          [ "$REF_TYPE" = tag ] || { echo "::error::run publish.yml on a release tag (gh workflow run publish.yml --ref <tag>)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: tools/resolve-tag.sh "$TAG" | tee -a "$GITHUB_OUTPUT"

  # Before the job that names registry-release: the environment is
  # protected (tag-only, no administrator bypass, and authorized by a
  # reviewer or by the admin-only tag ruleset) and every check main's rules
  # require passed for the tagged commit. Names no environment and reads no
  # secret (tools/check-environment.sh, tools/check-required-checks.sh).
  gate:
    name: Publication gate
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
          sparse-checkout: tools
      - name: registry-release deploys release tags only and authorizes every run
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/check-environment.sh registry-release
      - name: Every required check of main passed for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: tools/check-required-checks.sh "$COMMIT"

  build:
    name: Build packages
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
      - name: Build the pinned deckpilot-registry and schema-check
        run: tools/build-cli.sh
      - name: Rebuild every recorded package and check it against its pins
        run: |
          tools/validate.sh registry
          cp -R .work/validate/registry/releases "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          retention-days: 1
          if-no-files-found: error

  cli:
    # The pinned tools, built here and nowhere near a key: the signing
    # job installs these binaries after checking their sha256 and
    # compiles nothing (tools/cli-artifact.sh).
    name: Build the pinned deckpilot-registry
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      registry: ${{ steps.pack.outputs.registry }}
      schema: ${{ steps.pack.outputs.schema }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
      - name: Build the pinned deckpilot-registry and schema-check (DeckPilot code only)
        run: tools/build-cli.sh
      - id: pack
        name: The binaries and their sha256
        run: tools/cli-artifact.sh pack "$RUNNER_TEMP/cli" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deckpilot-cli
          path: ${{ runner.temp }}/cli
          retention-days: 1
          if-no-files-found: error

  sign:
    name: Sign the registry
    needs: [resolve, gate, build, cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: registry-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deckpilot-cli
          path: ${{ runner.temp }}/cli
      - name: Install the cli job's deckpilot-registry (sha256 checked; nothing compiles here)
        env:
          REGISTRY_SHA256: ${{ needs.cli.outputs.registry }}
          SCHEMA_SHA256: ${{ needs.cli.outputs.schema }}
        run: tools/cli-artifact.sh install "$RUNNER_TEMP/cli" "$REGISTRY_SHA256" "$SCHEMA_SHA256"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      # The mirror the new index is built on must be at least as new as the
      # last verified deployment: Pages' CDN can serve the previous one for
      # 10 minutes, and an index signed on it would reuse a seq clients
      # already have (tools/registry-state.sh, tools/mirror-site.sh).
      - name: The last verified deployment (branch registry-state)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/registry-state.sh fetch "$RUNNER_TEMP/min-state.json"
      - name: Verify the packages against the pins, sign index and timestamp, verify as an existing client
        env:
          REGISTRY_INDEX_KEY: ${{ secrets.REGISTRY_INDEX_KEY }}
          REGISTRY_INDEX_KEY_PASSWORD: ${{ secrets.REGISTRY_INDEX_KEY_PASSWORD }}
          REGISTRY_TIMESTAMP_KEY: ${{ secrets.REGISTRY_TIMESTAMP_KEY }}
          REGISTRY_TIMESTAMP_KEY_PASSWORD: ${{ secrets.REGISTRY_TIMESTAMP_KEY_PASSWORD }}
        run: |
          [ ! -f "$RUNNER_TEMP/min-state.json" ] || export REGISTRY_MIN_STATE="$RUNNER_TEMP/min-state.json"
          tools/publish-site.sh index --packages "$RUNNER_TEMP/packages" \
            --out "$RUNNER_TEMP/ws" --base-url "$REGISTRY_URL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-v1
          path: ${{ runner.temp }}/ws/site/v1
          retention-days: 1
          if-no-files-found: error

  release:
    name: Upload the release asset
    needs: [resolve, sign]
    if: needs.resolve.outputs.kind == 'plugin'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: Upload to the release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          ID: ${{ needs.resolve.outputs.id }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: tools/upload-release.sh "$TAG" "$ID" "$VERSION" "$RUNNER_TEMP/packages"

  website:
    name: Website
    needs: [resolve, sign]
    uses: ./.github/workflows/_website.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      registry-artifact: registry-v1
      registry-path: .
      registry-verified: true
      # The tagged commit passed the browser tests when it reached main; a
      # publication must not depend on them a second time.
      browser-tests: false
    permissions:
      contents: read

  # The commit this run's Pages deployment is recorded under: Pages ignores
  # a second deployment of a build version it has seen and refuses one that
  # is not a commit (tools/pages-build-commit.sh). Its only permission is
  # writing a build commit to the branch pages-builds; it runs no
  # repository code but that script and has no secret.
  pages-build:
    name: Pages build commit
    needs: [resolve, sign, release, website]
    if: always() && needs.sign.result == 'success' && needs.website.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
          ref: ${{ needs.resolve.outputs.commit }}
      - id: commit
        name: Append a build commit to pages-builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/pages-build-commit.sh

  deploy:
    name: Deploy the registry
    needs: [resolve, sign, release, website, pages-build]
    if: always() && needs.sign.result == 'success' && needs.website.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && needs.pages-build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-v1
          path: ${{ runner.temp }}/registry-v1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website
          path: ${{ runner.temp }}/website
      - name: Compose the signed /v1/ (byte for byte) and the website around it
        run: |
          tools/build-landing.sh "$RUNNER_TEMP/registry"
          rm -rf "$RUNNER_TEMP/registry/v1"
          mv "$RUNNER_TEMP/registry-v1" "$RUNNER_TEMP/registry/v1"
          python3 -I tools/compose-site.py --registry "$RUNNER_TEMP/registry" \
            --website "$RUNNER_TEMP/website" --out "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      # Not actions/deploy-pages: it deploys under the run's commit, and
      # Pages keeps the content of an earlier deployment of the same commit
      # (tools/deploy-pages.sh, tools/pages-build-commit.sh).
      - id: deployment
        name: Deploy to Pages under the build commit
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BUILD_COMMIT: ${{ needs.pages-build.outputs.sha }}
        run: tools/deploy-pages.sh

  verify-published:
    name: Verify the published registry
    needs: [resolve, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}
      - name: Build the pinned deckpilot-registry
        run: tools/build-cli.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-v1
          path: ${{ runner.temp }}/expected
      - name: Fetch the live site anonymously and verify it
        run: tools/verify-published.sh "$REGISTRY_URL" "$RUNNER_TEMP/expected/timestamp.json"

  # Only after the live site was proven to serve the signed registry: its
  # timestamp becomes the floor of the next mirror. Its only permission is
  # writing a commit to the branch registry-state; no secret.
  record:
    name: Record the verified registry state
    needs: [resolve, verify-published]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-v1
          path: ${{ runner.temp }}/registry-v1
      - name: Append the state to registry-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/registry-state.sh record "$RUNNER_TEMP/registry-v1/timestamp.json"
