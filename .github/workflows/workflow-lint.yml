# Lints every workflow with actionlint and zizmor (pinned, checksum-verified
# binaries; see tools/lint-workflows.sh). No secrets, read-only token.
name: Workflow lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: actionlint and zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository workflow rules (secrets, environments, pins, triggers)
        run: python3 -I tools/check-workflows.py
      - name: Lint .github/workflows
        run: tools/lint-workflows.sh
