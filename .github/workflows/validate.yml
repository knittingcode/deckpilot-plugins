# Untrusted: runs on every pull request, including forks, and on main.
# No secrets, no environment, a read-only token, no caches. It may build
# contributor plugin code (cargo build scripts run here), so nothing it
# produces is ever used by a publishing workflow: publish.yml rebuilds
# everything from the reviewed commit itself.
#
# Because pull_request runs the workflow file of the pull request's merge
# ref, a pull request can change these checks; their result is advisory for
# changes to .github/, tools/ and schemas/, which need code-owner review.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No private keys, key files or generated output
        run: python3 -I tools/check-hygiene.py
      # Required on main: the privileged plugins' code is the reviewed code
      # (official/reviewed-sources.json; stdlib only, nothing built).
      # The five ids are fixed here too, not read from the files under review.
      - name: The privileged official plugins' code is the reviewed code
        run: |
          python3 -I tools/check-official.py --root official --reviewed-sources | tee "$RUNNER_TEMP/reviewed.txt"
          grep -qx "official: the reviewed code of 5 privileged plugin(s) is unchanged (official/reviewed-sources.json): deckpilot.docker, deckpilot.git, deckpilot.projects, deckpilot.workflows, deckpilot.workspace" "$RUNNER_TEMP/reviewed.txt" ||
            { echo "::error::the reviewed code check does not cover exactly docker, git, projects, workflows and workspace"; exit 1; }
      - name: Tests of the publication and timestamp gates
        run: tools/tests/test-release-gates.sh
      - name: Tests of the Pages deployment
        run: tools/tests/test-deploy-pages.sh
      - name: Tests of the Pages build commit
        run: tools/tests/test-pages-build-commit.sh
      - name: Tests of the registry freshness guard, state record and monitor
        run: tools/tests/test-registry-freshness.sh
      - name: Tests of the first-party-only signing gate
        run: tools/tests/test-first-party-only.sh
      - name: Tests of the workflow rules (secrets, environments, the two publisher keys)
        run: python3 -I tools/tests/test_check_workflows.py
      - name: Tests of the DeckPilot pin (a commit of DeckPilot's main only)
        run: tools/tests/test-deckpilot-pin.sh
      - name: Tests of the registry tag guard (never a bundled plugin)
        run: tools/tests/test-resolve-tag.sh
      - name: Tests of the tools handed to signing jobs (sha256-checked, nothing compiled there)
        run: tools/tests/test-cli-artifact.sh
      - name: Tests of the two-key official release steps (missing or extra keys, one signature, no release)
        run: tools/tests/test-official-release.sh
      - name: Tests of the publisher pin check
        run: python3 -I tools/tests/test_check_publisher_pin.py
      - name: Tests of the hygiene rules (storefront media)
        run: python3 -I tools/tests/test_check_hygiene.py
      - name: Tests of the storefront schemas and checks
        run: python3 -I tools/tests/test_storefront.py
      - name: Tests of Marketplace Studio (token, Host/Origin, path confinement, JSON round trip, resolver)
        run: python3 -I tools/tests/test_studio.py
      # Git only (the commit of tools/deckpilot.env, on DeckPilot's main);
      # nothing of DeckPilot is built or run here.
      - name: DeckPilot pins at least two distinct publisher keys (threshold >= 2); the verify jobs use exactly that file
        run: |
          tools/official.sh fetch-deckpilot
          python3 -I tools/check-publisher-pin.py

  submission:
    name: Submission rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tests of the submission rules
        run: python3 -I tools/tests/test_check_submission.py
      - name: Path guard, publisher identity, append-only versions, permission diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          python3 -I tools/check-submission.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            --author "$AUTHOR" --author-id "$AUTHOR_ID"

  schemas:
    name: Schemas match DeckPilot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: schemas/, rust-toolchain.toml and reserved publishers equal the pinned DeckPilot commit
        run: tools/check-schemas.sh

  registry:
    name: Validate registry
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request's base, for the storefront pipeline test's
          # baseline (the site with the storefront off is the base's).
          fetch-depth: 0
      - name: Build the pinned deckpilot-registry and schema-check
        run: tools/build-cli.sh
      - name: Inputs, rebuilt packages, throwaway-key signed registry, verify-site
        run: tools/validate.sh registry
      - name: Storefront inputs (the pinned storefront check; throwaway-key build, sign, verify-site --require-storefront)
        run: tools/validate.sh storefront
      - name: Tests of the storefront in the signing pipeline (off is the base's site; on, refresh, revert)
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha }}
        run: tools/tests/test-storefront-site.sh
      - name: Tests of the registry freshness guard with the pinned tools (a timestamp refresh keeps the storefront)
        run: tools/tests/test-registry-freshness.sh --with-cli
      - name: Storefront preview (static wireframe of Discover; Marketplace Studio)
        run: |
          python3 -I tools/studio/studio.py render-preview --out "$RUNNER_TEMP/storefront-preview"
          cat "$RUNNER_TEMP/storefront-preview/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storefront-preview
          path: ${{ runner.temp }}/storefront-preview
          retention-days: 7

  examples:
    name: Build examples
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the pinned deckpilot-registry and schema-check
        run: tools/build-cli.sh
      - name: Build each example and verify it in a throwaway-key registry
        run: tools/validate.sh examples
