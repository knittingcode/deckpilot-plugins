# Reusable: builds and checks the marketplace website (website/) and uploads
# it as the artifact `website`. Called by website.yml (pull requests),
# _site.yml (deploys from main) and publish.yml (deploys from a release tag).
#
# Unprivileged by construction: no environment, no secret, a read-only
# token, no caches. It runs npm packages, so nothing it produces is trusted
# with the registry: tools/compose-site.py (in a later job that runs no npm
# code) copies the verified registry tree over the result byte for byte and
# fails if the website touches a registry path.
#
# The catalog pages are generated from a registry tree when the caller
# passes one (an artifact of the same run). The website only reads it.
name: Website build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (default, the commit of the run)
        type: string
        default: ""
      registry-artifact:
        description: Artifact of this run that holds the registry tree (empty, no registry is published)
        type: string
        default: ""
      registry-path:
        description: Path of the v1 directory inside that artifact
        type: string
        default: v1
      registry-verified:
        description: The caller verified that tree with deckpilot-registry verify-site
        type: boolean
        default: false

permissions: {}

jobs:
  website:
    name: Build and test website
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.registry-artifact != ''
        with:
          name: ${{ inputs.registry-artifact }}
          path: ${{ runner.temp }}/registry
      - name: Install the locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run check
      - name: Build the site from the registry tree
        env:
          REGISTRY_ARTIFACT: ${{ inputs.registry-artifact }}
          REGISTRY_PATH: ${{ inputs.registry-path }}
          REGISTRY_VERIFIED: ${{ inputs.registry-verified }}
        run: |
          if [ -n "$REGISTRY_ARTIFACT" ]; then
            export REGISTRY_DIR="$RUNNER_TEMP/registry/$REGISTRY_PATH"
            export MANIFESTS_DIR="$GITHUB_WORKSPACE/plugins"
            [ "$REGISTRY_VERIFIED" = true ] && export REGISTRY_TRUST=verified
            if [ -f "$REGISTRY_DIR/timestamp.json" ]; then
              echo "Catalog: registry $(jq -c '{seq, keys_version}' "$REGISTRY_DIR/timestamp.json")" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Catalog: no signed registry is published; the catalog is empty." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Catalog: built without a registry tree; the catalog is empty." >> "$GITHUB_STEP_SUMMARY"
          fi
          npm run build
      - name: Build the test-only fixture catalog (never deployed)
        run: npm run build:fixture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: website/dist
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
