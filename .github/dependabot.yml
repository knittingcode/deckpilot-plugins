version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /tools/schema-check
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  # The dependencies built into the first-party plugins. A merged update
  # changes the next build only: published versions are rebuilt from the
  # commit their record pins. Publishing it is a new plugin version.
  - package-ecosystem: cargo
    directory: /first-party
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      first-party:
        patterns: ["*"]
    ignore:
      # Pinned to the DeckPilot commit of tools/deckpilot.env; moved with
      # that pin by hand (Schemas match DeckPilot).
      - dependency-name: deckpilot-plugin-sdk
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      website:
        patterns: ["*"]
    ignore:
      # Astro's type checker (@astrojs/check) sets the supported TypeScript
      # major; take a new major together with it, by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
