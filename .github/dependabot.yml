version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /tools/schema-check
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      website:
        patterns: ["*"]
    ignore:
      # Astro's type checker (@astrojs/check) sets the supported TypeScript
      # major; take a new major together with it, by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
