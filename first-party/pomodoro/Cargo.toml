# deckpilot.pomodoro: a focus and break timer, driven by a scheduled
# workflow that calls `tick` (plugin API 1.0 has no timers).
[package]
name = "deckpilot-pomodoro"
description = "DeckPilot plugin: Pomodoro focus and break timer with notifications, auto-start and session statistics"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deckpilot-plugin-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
