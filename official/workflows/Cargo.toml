# deckpilot.workflows: the official Workflows plugin (DeckPilot
# docs/marketplace/module-migration.md §7 X8, WP-B5). Moved here from
# DeckPilot's plugins/first-party/workflows (official/README.md); its id,
# view, navigation entry and permission are unchanged (src/tests.rs).
#
# A manifest-only guest without actions: it activates the app's own
# Workflows screen and its navigation entry (`hostViews`). The workflow
# engine, its bindings and its execution IPC stay in DeckPilot's core.
# DeckPilot bundles it with class `default`: seeded on every computer.
#
# `hostViews` is a plugin API 1.9 privileged kind, so this plugin is `held`
# in plugins.json: built, tested and checked for reproducibility here; its
# package is refused and nothing is released until the security review
# opens the gate.
#
# A member of the official/ workspace (shared Cargo.lock and the `guest`
# profile), built for wasm32-unknown-unknown; the rlib crate type lets its
# native unit tests run with plain `cargo test`.
[package]
name = "deckpilot-workflows"
description = "DeckPilot's first-party Workflows plugin: the app's Workflows screen"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deckpilot-plugin-sdk.workspace = true

[dev-dependencies]
jsonschema.workspace = true
serde_json.workspace = true

[lints]
workspace = true
