# deckpilot.workspace: the first-party Workspace plugin, the replacement of
# the built-in `workspace` module (DeckPilot's
# docs/marketplace/module-migration.md §7, WP-B3). It opens bound folders
# and files in a bound editor and pages in the browser through plugin API
# 1.9's `resource.open` and `url.openParam`. Bundled with class `migration`
# (DeckPilot's plugins/first-party/bundled.json); not routed until its alias
# block and migration plan land (WP-C1).
#
# Moved from DeckPilot's plugins/first-party/workspace at the pinned commit
# (tools/deckpilot.env): ids, action ids, parameters, settings, permissions,
# dependencies, locales, assets and LICENSE unchanged, only `version` and
# `repository` differ (src/contract.rs compares). A member of the official/
# workspace, built for wasm32-unknown-unknown with the `guest` profile; the
# rlib crate type lets its native unit tests run with plain `cargo test`.
[package]
name = "deckpilot-workspace"
description = "DeckPilot's first-party Workspace plugin: a project's repository in an editor and its pages in the browser"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deckpilot-plugin-sdk.workspace = true
serde_json.workspace = true

[dev-dependencies]
jsonschema.workspace = true

[lints]
workspace = true
