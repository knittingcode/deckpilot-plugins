# deckpilot.git-providers: GitHub and GitLab servers the user connects, each
# with its own token (DeckPilot design-git-providers.md). Plugin API 1.14
# (connections), which no DeckPilot provides yet: held ahead of the pin
# (plugins.json `hostApi`), never packaged, signed or released until then.
#
# A member of the official/ workspace, built for wasm32-unknown-unknown; the
# rlib crate type lets its native unit tests run with plain `cargo test`. The
# connection operations go through the raw host call of guest ABI 1
# (deckpilot-plugin-guest), so the SDK pin does not move.
[package]
name = "deckpilot-git-providers"
description = "DeckPilot's first-party Git Providers plugin: repositories, merge requests and pipelines of the servers you connect"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deckpilot-plugin-sdk.workspace = true
deckpilot-plugin-guest.workspace = true
deckpilot-first-party-support.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
