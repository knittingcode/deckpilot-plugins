# deckpilot.gitlab: the official GitLab plugin, the replacement of DeckPilot's
# former built-in `gitlab` module (DeckPilot docs/marketplace/module-migration.md
# §9, P11). DeckPilot bundles it with class `migration`. Moved here from
# DeckPilot's plugins/first-party/gitlab (official/README.md); its id, action
# ids, settings and credential slot are unchanged (src/contract.rs).
#
# A member of the official/ workspace (shared Cargo.lock and the `guest`
# profile), built for wasm32-unknown-unknown; the rlib crate type lets its
# native unit tests run with plain `cargo test`.
[package]
name = "deckpilot-gitlab"
description = "DeckPilot's first-party GitLab plugin: read-only merge requests, reviews and pipelines"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deckpilot-plugin-sdk.workspace = true
# URLs without a URL parser (the `url` crate's IDNA tables would more than
# double the module), the time limit and text helpers, shared by DeckPilot's
# plugins for a server the user enters.
deckpilot-first-party-support.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `guest::features`, to check what `dp_features` reports.
deckpilot-plugin-abi.workspace = true
jsonschema.workspace = true

[lints]
workspace = true
